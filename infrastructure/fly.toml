# Fly.io config for apps/api
# Deploy:
#   fly launch --config infrastructure/fly.toml --dockerfile apps/api/Dockerfile --no-deploy
#   fly secrets set INTERNAL_API_TOKEN=… ALLOWED_ORIGINS=https://your-app.vercel.app
#   fly deploy --config infrastructure/fly.toml --dockerfile apps/api/Dockerfile

app = "luminary-ai-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
